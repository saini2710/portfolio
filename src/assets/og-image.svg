<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ogCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="ogCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Ambient background glow -->
  <circle cx="200" cy="150" r="300" fill="#38bdf8" opacity="0.1" filter="blur(80px)"/>
  <circle cx="1000" cy="480" r="320" fill="#818cf8" opacity="0.12" filter="blur(90px)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Content Box -->
  <g transform="translate(100, 100)">
    <!-- Pill -->
    <rect width="360" height="38" rx="19" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="5" fill="#38bdf8"/>
    <text x="36" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="1px">11+ YEARS PROFESSIONAL EXPERIENCE</text>

    <!-- Name & Title -->
    <text x="0" y="110" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5px">Gurjit Singh</text>
    <text x="0" y="170" fill="url(#ogCyan)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5px">Senior Full Stack Web Developer</text>

    <text x="0" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">Architecting high-scale web applications, custom WooCommerce, Shopify,</text>
    <text x="0" y="270" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">REST APIs, payment gateways, and robust business integrations.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 320)">
      <rect width="80" height="38" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
      <text x="40" y="24" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">PHP</text>

      <rect x="95" width="130" height="38" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
      <text x="160" y="24" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">WordPress</text>

      <rect x="240" width="155" height="38" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
      <text x="317" y="24" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">WooCommerce</text>

      <rect x="410" width="105" height="38" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
      <text x="462" y="24" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">Shopify</text>

      <rect x="530" width="135" height="38" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
      <text x="597" y="24" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">JavaScript</text>

      <rect x="680" width="115" height="38" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
      <text x="737" y="24" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">Laravel</text>

      <rect x="810" width="125" height="38" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
      <text x="872" y="24" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">REST APIs</text>
    </g>
  </g>

  <!-- Subtle border around entire frame -->
  <rect x="15" y="15" width="1170" height="600" rx="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
</svg>
